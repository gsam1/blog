title: My Blog
description: A personal blog
baseurl: ""
url: ""

permalink: /:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections_dir: all_collections
collections:
  posts:
    output: true

defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - sitemap.xml
  - feed.xml
  - LICENSE
